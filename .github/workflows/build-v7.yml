name: Build e-Courier Root APK v7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v7.yml'

permissions:
  contents: read

jobs:
  build-v7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate base Android project
        shell: bash
        run: |
          set -e

          awk '
            /^      - name: Create Android project$/ { found=1; next }
            found && /^        run: \|$/ { capture=1; next }
            capture && /^      - name:/ { exit }
            capture {
              sub(/^          /, "")
              print
            }
          ' .github/workflows/build.yml > /tmp/create-project.sh

          bash /tmp/create-project.sh

      - name: Patch exact working entry URL
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # New package = completely fresh WebView data/cookies.
          g = Path("app/build.gradle")
          s = g.read_text(encoding="utf-8")
          s = s.replace(
              'applicationId "com.mahex.ecouriermobile"',
              'applicationId "com.mahex.ecouriermobile.v7"'
          )
          s = s.replace("versionCode 1", "versionCode 7")
          s = s.replace('versionName "1.0"', 'versionName "7.0"')
          g.write_text(s, encoding="utf-8")

          m = Path("app/src/main/AndroidManifest.xml")
          s = m.read_text(encoding="utf-8")
          s = s.replace('android:label="e-Courier"', 'android:label="e-Courier v7"')
          m.write_text(s, encoding="utf-8")

          p = Path("app/src/main/java/com/mahex/ecouriermobile/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          # Use the exact URL that works when opened directly.
          s = s.replace(
              'private static final String HOME_URL = "https://ecourier.mahex.com/";',
              'private static final String HOME_URL = "https://ecourier.mahex.com/ecourier-web/";'
          )

          # Only apply responsive fixes after we are actually inside eCourier.
          old = '''                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectMobileFix(url);
                          CookieManager.getInstance().flush();
                      }
          '''

          new = '''                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          if (url != null && url.contains("/ecourier-web/")) {
                              injectMobileFix(url);
                          }

                          CookieManager.getInstance().flush();
                      }
          '''

          if old not in s:
              raise SystemExit("Could not locate onPageFinished")

          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build APK v7
        run: gradle --no-daemon assembleDebug

      - name: Upload APK v7
        uses: actions/upload-artifact@v4
        with:
          name: ecourier-root-apk-v7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
