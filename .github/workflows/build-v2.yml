name: Build e-Courier Android APK v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v2.yml'

permissions:
  contents: read

jobs:
  build-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate project from v1 workflow
        shell: bash
        run: |
          set -e
          awk '
            /^      - name: Create Android project$/ { found=1; next }
            found && /^        run: \|$/ { capture=1; next }
            capture && /^      - name:/ { exit }
            capture {
              sub(/^          /, "")
              print
            }
          ' .github/workflows/build.yml > /tmp/create-project.sh

          bash /tmp/create-project.sh

      - name: Patch login compatibility
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/mahex/ecouriermobile/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          # Make WebView identify more like normal Chrome. Some SSO/UAA setups
          # behave differently when the User-Agent contains the WebView marker.
          marker = """                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  );
          """
          ua = """                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  );

                  String normalUa = settings.getUserAgentString();
                  if (normalUa != null) {
                      normalUa = normalUa.replace("; wv", "");
                      normalUa = normalUa.replace("Version/4.0 ", "");
                      settings.setUserAgentString(normalUa);
                  }
          """
          if marker not in s:
              raise SystemExit("Could not find WebSettings marker")
          s = s.replace(marker, ua, 1)

          # The site can redirect its login flow to http://ecourier.mahex.com.
          # Normal Chrome may upgrade it to HTTPS automatically. In WebView,
          # force same-host HTTP navigation back to HTTPS so OAuth/SAML callback
          # scheme/redirect validation stays consistent.
          old = """                  String scheme = uri.getScheme();

                  if ("http".equalsIgnoreCase(scheme)
                      || "https".equalsIgnoreCase(scheme)) {
                      return false;
                  }
          """
          new = """                  String scheme = uri.getScheme();
                  String host = uri.getHost();

                  if ("http".equalsIgnoreCase(scheme)
                      && host != null
                      && MAIN_HOST.equalsIgnoreCase(host)) {

                      Uri httpsUri = uri.buildUpon()
                          .scheme("https")
                          .build();

                      webView.loadUrl(httpsUri.toString());
                      return true;
                  }

                  if ("http".equalsIgnoreCase(scheme)
                      || "https".equalsIgnoreCase(scheme)) {
                      return false;
                  }
          """
          if old not in s:
              raise SystemExit("Could not find navigation marker")
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Build APK v2
        run: gradle --no-daemon assembleDebug

      - name: Upload APK v2
        uses: actions/upload-artifact@v4
        with:
          name: ecourier-mobile-apk-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
