name: Build e-Courier GeckoView APK v3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create GeckoView Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/mahex/ecouriergecko
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets/ecourierfix

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url "https://maven.mozilla.org/maven2/"
                  }
              }
          }

          rootProject.name = "ECourierGecko"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mahex.ecouriergecko'
              compileSdk 35

              defaultConfig {
                  applicationId "com.mahex.ecouriergecko"
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName "3.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "org.mozilla.geckoview:geckoview:153.0.20260810162159"
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">e-Courier Firefox</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <org.mozilla.geckoview.GeckoView
                  android:id="@+id/geckoview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <ProgressBar
                  android:id="@+id/progress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="4dp"
                  android:layout_gravity="top"
                  android:max="100" />

          </FrameLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="stateUnspecified|adjustResize"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/assets/ecourierfix/manifest.json <<'EOF'
          {
            "manifest_version": 2,
            "name": "e-Courier Mobile Fix",
            "version": "3.0",
            "browser_specific_settings": {
              "gecko": {
                "id": "ecourier-mobile-fix@local"
              }
            },
            "content_scripts": [
              {
                "matches": [
                  "*://ecourier.mahex.com/*"
                ],
                "css": [
                  "mobile.css"
                ],
                "js": [
                  "mobile.js"
                ],
                "run_at": "document_end"
              }
            ]
          }
          EOF

          cat > app/src/main/assets/ecourierfix/mobile.css <<'EOF'
          html, body {
            max-width: 100vw !important;
          }

          html {
            -webkit-text-size-adjust: 100%;
          }

          body {
            overflow-x: hidden !important;
          }

          *, *::before, *::after {
            box-sizing: border-box !important;
          }

          img, video, canvas, svg, iframe {
            max-width: 100% !important;
            height: auto;
          }

          @media (max-width: 767px) {
            body {
              min-width: 0 !important;
              width: 100% !important;
            }

            .wrapper,
            .content-wrapper,
            .right-side,
            .main-footer,
            .content,
            .page-container,
            #page-content-wrapper {
              min-width: 0 !important;
              max-width: 100% !important;
            }

            .content-wrapper,
            .right-side,
            .main-footer {
              margin-left: 0 !important;
              margin-right: 0 !important;
            }

            .content {
              padding: 7px !important;
            }

            .content-header {
              padding-left: 7px !important;
              padding-right: 7px !important;
            }

            .fixed-header {
              position: static !important;
              width: 100% !important;
              height: auto !important;
            }

            .ui-header-title {
              display: flex !important;
              flex-wrap: wrap !important;
              width: 100% !important;
              gap: 6px !important;
            }

            .split-left,
            .split-right,
            .ui-header-title .split-left,
            .ui-header-title .split-right {
              float: none !important;
              width: 100% !important;
              max-width: 100% !important;
              margin: 0 !important;
            }

            .ui-header-title .split-right {
              display: flex !important;
              flex-wrap: wrap !important;
              gap: 6px !important;
            }

            .ui-header-image {
              display: none !important;
            }

            #wrapper,
            #wrapper.toggled {
              padding-left: 0 !important;
              padding-right: 0 !important;
              width: 100% !important;
            }

            #wrapper.toggled #page-content-wrapper {
              position: relative !important;
              margin-left: 0 !important;
              margin-right: 0 !important;
            }

            #sidebar-wrapper {
              position: fixed !important;
              top: 0 !important;
              right: 0 !important;
              left: auto !important;
              width: 0 !important;
              height: 100vh !important;
              margin: 0 !important;
              overflow-x: hidden !important;
              overflow-y: auto !important;
              z-index: 10000 !important;
              background: #fff !important;
            }

            #wrapper.toggled #sidebar-wrapper {
              width: 94vw !important;
              max-width: 350px !important;
            }

            #sidebar-wrapper .sidebar-nav {
              position: relative !important;
              width: 100% !important;
              max-width: 100% !important;
            }

            #search-box-body {
              max-height: calc(100vh - 120px) !important;
              overflow-y: auto !important;
              overflow-x: hidden !important;
            }

            form,
            fieldset,
            .form-group,
            .input-group,
            .input-group-btn,
            .searchFormSection,
            .box,
            .box-body,
            .box-header {
              max-width: 100% !important;
            }

            .input-group {
              width: 100% !important;
            }

            input.form-control,
            select.form-control,
            textarea.form-control {
              width: 100% !important;
              max-width: 100% !important;
              font-size: 16px !important;
            }

            input.form-control,
            select.form-control {
              min-height: 42px !important;
            }

            .select2-container,
            .select2-container.form-control,
            [id^="s2id_"],
            .select2-choice,
            .select2-choices {
              width: 100% !important;
              min-width: 0 !important;
              max-width: 100% !important;
            }

            .select2-drop,
            .select2-drop-active {
              max-width: calc(100vw - 20px) !important;
            }

            .table-responsive,
            .dataTables_wrapper {
              width: 100% !important;
              max-width: 100% !important;
              overflow-x: auto !important;
              overflow-y: visible !important;
            }

            table.dataTable,
            .dataTables_wrapper table {
              min-width: 900px !important;
              width: max-content !important;
              max-width: none !important;
              white-space: nowrap !important;
            }

            .table-header-links,
            .table-header-select {
              float: none !important;
              width: 100% !important;
              max-width: 100% !important;
            }

            .table-header-links {
              display: flex !important;
              flex-wrap: wrap !important;
              gap: 5px !important;
            }

            .pagination {
              display: flex !important;
              flex-wrap: wrap !important;
            }

            .modal-dialog,
            .modal-dialog.modal-xl,
            .modal-lg,
            .modal-sm {
              width: auto !important;
              max-width: calc(100vw - 14px) !important;
              margin: 7px auto !important;
            }

            .modal-body {
              overflow-x: auto !important;
            }

            .btn:not(.btn-xs) {
              min-height: 42px !important;
              white-space: normal !important;
            }

            .main-sidebar .slimScrollDiv,
            .main-sidebar .sidebar {
              height: auto !important;
              max-height: none !important;
            }
          }
          EOF

          cat > app/src/main/assets/ecourierfix/mobile.js <<'EOF'
          (function () {
            'use strict';

            if (window.__ecourierMobileGecko) return;
            window.__ecourierMobileGecko = true;

            var viewport = document.querySelector('meta[name="viewport"]');
            if (!viewport) {
              viewport = document.createElement('meta');
              viewport.name = 'viewport';
              document.head.appendChild(viewport);
            }
            viewport.content =
              'width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover';

            function normalize(root) {
              root = root || document;
              if (!root.querySelectorAll) return;

              root.querySelectorAll('.select2-container[style*="width"]')
                .forEach(function (el) {
                  el.style.setProperty('width', '100%', 'important');
                  el.style.setProperty('max-width', '100%', 'important');
                });

              root.querySelectorAll('.table-responsive, .dataTables_wrapper')
                .forEach(function (el) {
                  el.style.setProperty('-webkit-overflow-scrolling', 'touch');
                });
            }

            normalize(document);

            new MutationObserver(function (mutations) {
              mutations.forEach(function (mutation) {
                mutation.addedNodes.forEach(function (node) {
                  if (node && node.nodeType === 1) {
                    normalize(node);
                  }
                });
              });
            }).observe(document.documentElement, {
              subtree: true,
              childList: true
            });
          })();
          EOF

          cat > app/src/main/java/com/mahex/ecouriergecko/MainActivity.java <<'EOF'
          package com.mahex.ecouriergecko;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          import org.mozilla.geckoview.GeckoRuntime;
          import org.mozilla.geckoview.GeckoSession;
          import org.mozilla.geckoview.GeckoSessionSettings;
          import org.mozilla.geckoview.GeckoView;

          public class MainActivity extends Activity {

              private static final String HOME_URL =
                      "https://ecourier.mahex.com/";

              private static GeckoRuntime sRuntime;

              private GeckoSession session;
              private GeckoView geckoView;
              private ProgressBar progressBar;

              private boolean canGoBack = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  geckoView = findViewById(R.id.geckoview);
                  progressBar = findViewById(R.id.progress);

                  GeckoSessionSettings settings =
                      new GeckoSessionSettings.Builder()
                          .allowJavascript(true)
                          .build();

                  session = new GeckoSession(settings);

                  session.setContentDelegate(
                      new GeckoSession.ContentDelegate() {}
                  );

                  session.setNavigationDelegate(
                      new GeckoSession.NavigationDelegate() {
                          @Override
                          public void onCanGoBack(
                              GeckoSession session,
                              boolean value
                          ) {
                              canGoBack = value;
                          }

                          @Override
                          public void onLocationChange(
                              GeckoSession session,
                              String url,
                              java.util.List<
                                  GeckoSession.PermissionDelegate.ContentPermission
                              > perms,
                              Boolean hasUserGesture
                          ) {
                              progressBar.setVisibility(View.VISIBLE);
                          }
                      }
                  );

                  session.setProgressDelegate(
                      new GeckoSession.ProgressDelegate() {
                          @Override
                          public void onPageStart(
                              GeckoSession session,
                              String url
                          ) {
                              progressBar.setVisibility(View.VISIBLE);
                              progressBar.setIndeterminate(true);
                          }

                          @Override
                          public void onPageStop(
                              GeckoSession session,
                              boolean success
                          ) {
                              progressBar.setIndeterminate(false);
                              progressBar.setVisibility(View.GONE);

                              if (!success) {
                                  Toast.makeText(
                                      MainActivity.this,
                                      "بارگذاری صفحه کامل نشد",
                                      Toast.LENGTH_SHORT
                                  ).show();
                              }
                          }
                      }
                  );

                  if (sRuntime == null) {
                      sRuntime = GeckoRuntime.create(this);
                  }

                  sRuntime.getWebExtensionController()
                      .ensureBuiltIn(
                          "resource://android/assets/ecourierfix/",
                          "ecourier-mobile-fix@local"
                      );

                  session.open(sRuntime);
                  geckoView.setSession(session);

                  if (savedInstanceState == null) {
                      session.loadUri(HOME_URL);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (session != null && canGoBack) {
                      session.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (session != null) {
                      session.close();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build GeckoView APK
        run: gradle --no-daemon assembleDebug

      - name: Upload GeckoView APK
        uses: actions/upload-artifact@v4
        with:
          name: ecourier-geckoview-apk-v3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
