name: Build e-Courier Direct-Link APK v5

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v5.yml'

permissions:
  contents: read

jobs:
  build-v5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate base Android project
        shell: bash
        run: |
          set -e

          awk '
            /^      - name: Create Android project$/ { found=1; next }
            found && /^        run: \|$/ { capture=1; next }
            capture && /^      - name:/ { exit }
            capture {
              sub(/^          /, "")
              print
            }
          ' .github/workflows/build.yml > /tmp/create-project.sh

          bash /tmp/create-project.sh

      - name: Patch real e-Courier entry link
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/mahex/ecouriermobile/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              'private static final String HOME_URL = "https://ecourier.mahex.com/";',
              'private static final String HOME_URL = "http://ecourier.mahex.com/ecourier-web/agent/shipment";'
          )

          old = '''                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectMobileFix(url);
                          CookieManager.getInstance().flush();
                      }
          '''

          new = '''                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          if (url != null && url.toLowerCase().contains("/uaa")) {
                              String autoEnter =
                                  "(function(){"
                                  + "var links=document.querySelectorAll('a[href]');"
                                  + "for(var i=0;i<links.length;i++){"
                                  + "var h=links[i].getAttribute('href')||'';"
                                  + "var t=(links[i].innerText||'').trim().toLowerCase();"
                                  + "if(h.indexOf('/ecourier-web/')>=0 || t==='ecourier'){"
                                  + "window.location.href=links[i].href;"
                                  + "return 'opened';"
                                  + "}"
                                  + "}"
                                  + "return 'not-found';"
                                  + "})();";

                              view.evaluateJavascript(autoEnter, null);
                          }

                          if (url != null && url.contains("/ecourier-web/")) {
                              injectMobileFix(url);
                          }

                          CookieManager.getInstance().flush();
                      }
          '''

          if old not in s:
              raise SystemExit("onPageFinished marker not found")

          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build APK v5
        run: gradle --no-daemon assembleDebug

      - name: Upload APK v5
        uses: actions/upload-artifact@v4
        with:
          name: ecourier-direct-link-apk-v5
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
